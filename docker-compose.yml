# Local dependencies for `pnpm dev` and the integration/compliance test suites.
# Same major versions as production (Cloud SQL Postgres 16, Memorystore Redis 7) so that
# RLS policies, Postgres enums, timestamptz behaviour and Redis TTL semantics are exercised
# for real rather than against a mock. Nothing here holds data worth keeping:
# `pnpm services:reset` destroys the volumes.
#
# Credentials below are local-only throwaways. Real values live in Secret Manager (CLAUDE.md).

name: naaradh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: naaradh_migrator
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: naaradh_dev
      # Deterministic collation so ORDER BY in tests matches CI.
      POSTGRES_INITDB_ARGS: '--locale=C.UTF-8 --encoding=UTF8'
    ports:
      # Non-default host port: many machines already run a system Postgres on 5432, and
      # colliding with it is both confusing and dangerous — you want to be certain which
      # database a migration just ran against. Override with POSTGRES_PORT if needed.
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U naaradh_migrator -d naaradh_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence: every counter in Redis (concurrency, complaint windows, kill-switch
    # cache) is reconstructable, and the reconcile worker repairs leaks by design.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      # Non-default host port, for the same reason as Postgres. Override with REDIS_PORT.
      - '${REDIS_PORT:-56379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    restart: unless-stopped
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=naaradh-local
      - --host-port=0.0.0.0:8085
    ports:
      - '8085:8085'
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -sf http://localhost:8085/v1/projects/naaradh-local/topics || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
