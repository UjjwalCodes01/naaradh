# Dependency updates (P3-INF-6; SPEC §14 "Dependency scanning (Dependabot)").
#
# Everything is pinned exactly (AGENTS.md §11), so `versioning-strategy: increase` keeps pins
# exact while moving them. Updates are GROUPED so the repository does not fill with branches: per
# week, npm opens at most two PRs (minor + patch together, majors together — a major still gets
# its own review, just not its own branch), and every other ecosystem at most one. Commit messages
# follow Conventional Commits (`chore(deps): …`) like the rest of the history.
#
# Security updates are separate from this schedule: Dependabot opens them as soon as an advisory
# matches (Settings → Code security → Dependabot security updates must be on).
version: 2

updates:
  # pnpm workspace: one manifest tree from the root (pnpm-workspace.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    versioning-strategy: increase
    labels: [dependencies, npm]
    commit-message:
      prefix: chore(deps)
    groups:
      # Minor and patch, including the @shopify/* release train (ADR-0007): one PR a week.
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      # Every major together in one PR, so breaking changes are reviewed side by side.
      major:
        patterns: ['*']
        update-types: [major]

  # Third-party actions are pinned by commit SHA with a version comment (ci.yml); Dependabot
  # bumps the SHA and rewrites the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    labels: [dependencies, github-actions]
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']

  # The seven production images pin `node:22.<x>.<y>-bookworm-slim@sha256:…` in
  # `ARG NODE_IMAGE=` (docs/runbooks/deploy.md "Refresh the Node base image"). One grouped PR so
  # every Dockerfile moves in the same commit; the `images` CI job builds and trivy-scans them.
  - package-ecosystem: docker
    directories:
      - /api
      - /console
      - /hooks
      - /shopify
      - /voice
      - /web
      - /workers
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    labels: [dependencies, docker]
    commit-message:
      prefix: chore(deps)
    groups:
      node-base-image:
        patterns: ['node']

  # Provider pins in infra/versions.tf (+ .terraform.lock.hcl). Major provider upgrades are a
  # deliberate review (versions.tf stays on the 7.x line on purpose), so majors are ignored here.
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    labels: [dependencies, terraform]
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: hashicorp/google
        update-types: ['version-update:semver-major']
      - dependency-name: hashicorp/google-beta
        update-types: ['version-update:semver-major']
