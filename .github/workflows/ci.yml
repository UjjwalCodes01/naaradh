name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22 LTS is the production runtime (AGENTS.md §2.4). CI pins it regardless of what a
  # developer has locally.
  NODE_VERSION: '22'

jobs:
  # Fast feedback: anything that needs neither Docker nor secrets.
  static:
    name: lint / typecheck / unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: lint:pii (invariant 8 — no raw phone numbers in committed text)
        run: pnpm lint:pii
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: openapi drift (docs/api/openapi.json is generated — run `pnpm openapi` and commit)
        run: pnpm openapi && git diff --exit-code -- docs/api/openapi.json

  # The gate that blocks merges (CLAUDE.md). Kept as its own job so a red compliance suite
  # is unmistakable in the checks list rather than buried in a combined test run.
  compliance:
    name: compliance regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compliance

  contracts:
    name: engine adapter contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contracts

  integration:
    name: integration (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts its own Postgres 16 and Redis 7; the runner's Docker daemon is
      # all it needs. Using real engines is the point — RLS and TTL semantics do not exist
      # in a mock.
      - run: pnpm test:int

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # infra/ must always format and validate. Offline: no backend, no credentials (the read-only
  # plan against a real project is .github/workflows/terraform-plan.yml).
  terraform:
    name: terraform fmt / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.2'
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ hashFiles('infra/.terraform.lock.hcl') }}
      - run: terraform fmt -recursive -check -diff infra
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate

  # Production images build on every PR (no push): catches Dockerfile drift, a runtime import
  # that the flattened prod node_modules cannot resolve (infra/docker/check-imports.mjs runs
  # inside the build), and fixable CRITICAL CVEs (AGENTS.md §12: trivy).
  images:
    name: image ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, hooks, voice, workers, console, shopify, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          provenance: false
          tags: naaradh-${{ matrix.app }}:ci
          cache-from: type=gha,scope=image-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.app }}
      - name: container starts and fails only on configuration
        # With no env the process must die on the zod env check, never on a missing module.
        # (web validates its env lazily, per request — it gets the health check below instead.)
        if: matrix.app != 'web'
        run: |
          set +e
          out=$(docker run --rm -e WORKER=intents naaradh-${{ matrix.app }}:ci 2>&1)
          code=$?
          set -e
          echo "$out" | tail -n 20
          if echo "$out" | grep -Eq "ERR_MODULE_NOT_FOUND|Cannot find (module|package)|Dynamic require"; then
            echo "::error::image cannot resolve a runtime dependency"; exit 1
          fi
          if [ "$code" -eq 0 ]; then echo "::error::process exited 0 without configuration"; exit 1; fi
          echo "$out" | grep -q "Environment is invalid" || { echo "::error::expected the env validation error"; exit 1; }
      - name: web serves its health check without configuration
        if: matrix.app == 'web'
        run: |
          docker run -d --name web -e PORT=8080 -p 8080:8080 naaradh-web:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/healthz && exit 0; sleep 1; done
          docker logs web; exit 1
      - name: trivy (fixable CRITICAL fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: naaradh-${{ matrix.app }}:ci
          scan-type: image
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
